services:

  solution:
    image: ${REGISTRY}${COMPOSE_PROJECT_NAME}-solution:${VERSION:-latest}
    build:
      context: .
      args:
        BASE_IMAGE: ${SOLUTION_BASE_IMAGE}
        BUILD_IMAGE: ${SOLUTION_BUILD_IMAGE}
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION}
    scale: 0

  traefik:
    volumes:
      - ./docker/traefik:C:/etc/traefik

  redis:
    image: ${REGISTRY}${COMPOSE_PROJECT_NAME}-redis:${VERSION:-latest}
    scale: 0
    build:
      context: ./docker/build/redis
      args:
        BASE_IMAGE: ${SITECORE_DOCKER_REGISTRY}redis:${REDIS_VERSION}-${EXTERNAL_IMAGE_TAG_SUFFIX}

  mssql:
    image: ${REGISTRY}${COMPOSE_PROJECT_NAME}-xm1-mssql:${VERSION:-latest}
    build:
      context: ./docker/build/mssql
      args:
        BASE_IMAGE: ${SITECORE_DOCKER_REGISTRY}nonproduction/mssql-developer:${MSSQL_VERSION}-${EXTERNAL_IMAGE_TAG_SUFFIX}
    mem_limit: 2GB
    volumes:
      - ${LOCAL_DATA_PATH}\mssql:c:\data
    healthcheck:
      start_period: 60s
      start_interval: 1s

  mssql-init:
    image: ${REGISTRY}${COMPOSE_PROJECT_NAME}-xm1-mssql-init:${VERSION:-latest}
    build:
      context: ./docker/build/mssql-init
      args:
        BASE_IMAGE: ${SITECORE_DOCKER_REGISTRY}sitecore-xm1-mssql-init:${SITECORE_VERSION}
    mem_limit: 2GB
    healthcheck:
      start_interval: 1s

  solr:
    volumes:
      - ${LOCAL_DATA_PATH}\solr:c:\data
    healthcheck:
      start_period: 60s
      start_interval: 1s

  solr-init:
    image: ${REGISTRY}${COMPOSE_PROJECT_NAME}-xm1-solr-init:${VERSION:-latest}
    build:
      context: ./docker/build/solr-init
      args:
        BASE_IMAGE: ${SITECORE_DOCKER_REGISTRY}sitecore-xm1-solr-init:${SITECORE_VERSION}
    mem_limit: 1GB

  id:
    image: ${REGISTRY}${COMPOSE_PROJECT_NAME}-id:${VERSION:-latest}
    build:
      context: ./docker/build/id
      args:
        BASE_IMAGE: ${SITECORE_DOCKER_REGISTRY}sitecore-identity:${SITECORE_ID_VERSION}
    volumes:
      - ${HOST_LICENSE_FOLDER}:C:\license
    environment:
      SITECORE_LICENSE_LOCATION: C:\license\license.xml
    healthcheck:
      test: ["CMD", "pwsh", "-NoProfile", "-Command", "if (Get-Process Sitecore.IdentityServer.Host -ErrorAction SilentlyContinue) { exit 0 } else { exit 1 }"]
      interval: 10s
      start_period: 60s
      start_interval: 1s

  cd:
    image: ${REGISTRY}${COMPOSE_PROJECT_NAME}-xm1-cd:${VERSION:-latest}
    build:
      context: ./docker/build/cd
      args:
        BASE_IMAGE: ${SITECORE_DOCKER_REGISTRY}sitecore-xm1-cd:${SITECORE_VERSION}
        TOOLING_IMAGE: ${SITECORE_TOOLS_REGISTRY}sitecore-docker-tools-assets:${TOOLS_VERSION}
        SOLUTION_IMAGE: ${REGISTRY}${COMPOSE_PROJECT_NAME}-solution:${VERSION:-latest}
    scale: 0
    depends_on:
      - solution
    volumes:
      - ${LOCAL_DEPLOY_PATH}\website:C:\deploy
      - ${LOCAL_DATA_PATH}\cd:C:\inetpub\wwwroot\App_Data\logs
      - ${HOST_LICENSE_FOLDER}:C:\license
    environment:
      BASIC_COMPANY_URL: ${SITE_HOST}
      BASIC_COMPANY_DATABASE: ${SITE_DATABASE}
      SITECORE_LICENSE_LOCATION: C:\license\license.xml
      SITECORE_DEVELOPMENT_PATCHES: CustomErrorsOff,DiagnosticsOff,DeviceDetectionOff,RobotDetectionOff,InitMessagesOff
    entrypoint: ["powershell", "-Command", "& C:/scripts/Start.ps1"]
    labels:
      - "traefik.http.routers.cd-secure.rule=Host(`${SITE_HOST}`) || Host(`${CD_HOST}`)"

  cm:
    image: ${REGISTRY}${COMPOSE_PROJECT_NAME}-xm1-cm:${VERSION:-latest}
    build:
      context: ./docker/build/cm
      args:
        BASE_IMAGE: ${SITECORE_DOCKER_REGISTRY}sitecore-xm1-cm:${SITECORE_VERSION}
        TOOLING_IMAGE: ${SITECORE_TOOLS_REGISTRY}sitecore-docker-tools-assets:${TOOLS_VERSION}
        SOLUTION_IMAGE: ${REGISTRY}${COMPOSE_PROJECT_NAME}-solution:${VERSION:-latest}
    depends_on:
      - solution
    volumes:
      - ${LOCAL_DEPLOY_PATH}\website:C:\deploy
      - ${LOCAL_DATA_PATH}\cm:C:\inetpub\wwwroot\App_Data\logs
      - ${LOCAL_ITEM_PATH}:c:\items-mounted
      - .\docker\build\cm:C:\scripts-mounted
      - ${HOST_LICENSE_FOLDER}:C:\license
      - ${LOCAL_DATA_PATH}\cm_aspnet_temp:C:\aspnet-temp
    environment:
      BASIC_COMPANY_URL: ${CM_SITE_HOST}
      BASIC_COMPANY_DATABASE: ${CM_SITE_DATABASE}
      ITEM_SYNC_LOCATION: c:\items-mounted
      SITECORE_LICENSE_LOCATION: C:\license\license.xml
      UNICORN_SHARED_SECRET: ${UNICORN_SHARED_SECRET}
      UNICORN_ENABLE_TRANSPARENT_SYNC: ${UNICORN_ENABLE_TRANSPARENT_SYNC}
      ASPNET_TEMP_DIRECTORY: C:\aspnet-temp
      SITECORE_DEVELOPMENT_PATCHES: CustomErrorsOff,DiagnosticsOff,DeviceDetectionOff,RobotDetectionOff,InitMessagesOff
    entrypoint: ["powershell", "-Command", "& C:/scripts-mounted/Start.ps1"]
    healthcheck:
      timeout: 3s
      interval: 10s
      retries: 30
      start_period: 180s
      start_interval: 2s
